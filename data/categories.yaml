# 分类正本；标签/枚举/网站分类只能由此生成或引用。
schema_version: 3
review_status: approved
# 2026-10-07 用户批准阶段 1 契约冻结；分类定义审核通过。
categories:
  - id: templates
    label: 设计模板
    definition: 可反复用于创建特定形态设计产物的结构、起始文件、约束与示例；交付重点是产物形态。
    excludes: [画布快照或画布布局模板, 仅讲任务方法的 Skill, 单独的图片或视频生成提示词]
    subtypes:
      - id: prototype
        label: 原型
        definition: 页面、网站或应用的界面与交互原型结构。
      - id: deck
        label: Deck 演示
        definition: 以离散幻灯片组织叙事的演示文稿模板；不限定 PPTX 或 HTML。
      - id: three-d
        label: 三维
        definition: 三维场景、空间、模型展示或交互体验的起始结构；不等于已有完整 DCC 编辑器。
      - id: dashboard
        label: 仪表盘
        definition: 以指标、图表、数据筛选和分析视图组织内容的产物结构。
      - id: motion-graphics
        label: MG 动画
        definition: 以图形、文字、数据或品牌元素的时间变化为核心的动画结构；可为代码动画或视频工程。
      - id: document
        label: 文档
        definition: 报告、说明书、文章等阅读型产物的结构与版式；不限定 Word、Markdown 或 HTML。
      - id: custom
        label: 自定义
        definition: 明确具有可复用产物结构、且不符合前六类的模板；必须说明其具体形态，不作未知类别兜底。
  - id: design-systems
    label: 设计系统
    definition: 可应用于产物的系统化视觉与交互规范，覆盖排版、色彩、间距、状态与可访问性，并能对应到 tokens 和 CSS 等实现文件。
    minimum_profile: DESIGN.md 或等价设计规范 + 可追溯的 tokens + CSS；文件不必同名，必须解释映射。
    excludes: [只有风格描述或调色板的参考文档, 产品自身 UI 代码库未经资产化的内部实现, Agent 通用行为原则]
    subtypes: []
  - id: skills
    label: Skills
    definition: 指导 Agent 完成具体任务的可复用方法、步骤与辅助资源，通常以 SKILL.md 为入口。
    excludes: [以固定产物结构为核心的设计模板, 只有约束原则而无任务方法的文本, 运行该任务所需的工具本体]
    subtypes: []
  - id: prompts
    label: 提示词
    definition: 可直接复用或填入变量的生成、编辑或行为指导文本。
    subtypes:
      - id: image
        label: 图片提示词
        definition: 面向图像生成或编辑的文本、变量和参数说明；具体模型是兼容条件。
      - id: video
        label: 视频提示词
        definition: 面向视频生成或编辑的场景、镜头、运动、时序与参数文本。
      - id: principle
        label: 原则模板
        definition: AGENTS.md 等形式的重要 Agent 行为导引、工作约束与领域原则，如编码或设计原则；不包含用户私人记忆。
    excludes: [提示词生成器工具本体, 未获公开授权的产品内部 system prompt, 私人 AGENTS.md 与学习记忆]
  - id: plugins
    label: 插件
    definition: 具有稳定身份和安装或启用边界的能力分发单元，可包含一种或多种组件；MCP 或 CLI 可作为单组件插件，须能说明具体分发单元。
    excludes: [仅包含许多链接的合集, 任意目录的自动打包, 尚无分发边界的产品内部函数]
    subtypes: []
classification_rules:
  - 每个具体分发单元只有一个主类；以主要复用用途判断，不能仅凭文件名、仓库栏目或技术栈判断。
  - 先判断是否为有稳定身份的插件分发单元；插件整体归 plugins，内部组件分别描述，不据此把所有 SKILL.md 都归插件。
  - 单组件 MCP/CLI 只有独立安装、启用、版本或分发身份才单独登记为插件；仅随父插件提供的能力只记组件，外部要求只记依赖。已有独立资源的组件通过 resource_id 关联，不重复创建资源或把组件再加进资源计数。
  - 同一 SKILL.md 若核心是固定产物结构则归 templates；若核心是完成任务的方法则归 skills；纯行为约束归 prompts/principle。
  - 模板子类按主要产物选一个；仪表盘优先于一般原型，Deck 优先于一般文档；其他重叠须写 rationale。
  - Remotion 是技术/运行依赖；Remotion 方法是 Skill，具体可复用动画工程才是 MG 模板。
  - DESIGN.md 单文件可登记为 design-systems 的 reference 或 candidate，完整性不足不能标为 usable。
  - 图片/视频提示词不因附带媒体预览而变成设计模板；预览结果不等于可复用工程。
  - MCP、CLI 不设主类；它们在 plugins 下通过 components.type 描述。纯工具和组合插件使用同一字段。
  - 原则是 prompts 的子类；领域如编码/设计是 domains；AGENTS.md 是文件约定；三者分别记录。
  - general 仅在没有具体领域时使用，与其他 domains 互斥；跨多个明确领域时列出这些领域。
  - 来源、发现渠道、分发渠道、规范与运行依赖独立；目录站和市场不是内容作者，也不计为资源。
  - 不设资源包主类；组合分发使用插件概念。画布模板不在本次公共体系范围内。
dimensions:
  domains:
    - {id: general, label: 通用, definition: 跨领域或不依赖特定领域的资源。}
    - {id: software-engineering, label: 编码与工程, definition: 编码、测试、构建、部署与工程协作。}
    - {id: visual-design, label: 视觉与界面设计, definition: 品牌、视觉、排版与界面交互。}
    - {id: motion-video, label: 动效与视频, definition: MG、镜头、剪辑、字幕与影视生产。}
    - {id: three-d, label: 三维, definition: 建模、三维场景与空间交互。}
    - {id: data-visualization, label: 数据可视化, definition: 仪表盘、图表与数据叙事。}
    - {id: documents, label: 文档, definition: 阅读型文档与演示内容生产。}
    - {id: spatial-design, label: 空间设计, definition: 建筑、室内与景观。}
    - {id: research, label: 研究, definition: 检索、证据整理与分析。}
    - {id: marketing, label: 营销, definition: 宣传、广告与社交内容。}
    - {id: audio, label: 音频, definition: 音乐、声音与语音。}
  formats:
    - {id: markdown, label: Markdown, extensions: [.md], definition: Markdown 文本；文件角色另用 conventions 记录。}
    - {id: html, label: HTML, extensions: [.html], definition: HTML 页面或预览；不承诺离线可用。}
    - {id: css, label: CSS, extensions: [.css], definition: 样式表或 CSS tokens。}
    - {id: json, label: JSON, extensions: [.json], definition: 结构化元数据或配置。}
    - {id: yaml, label: YAML, extensions: [.yaml, .yml], definition: 结构化配置或规范。}
    - {id: typescript, label: TypeScript/TSX, extensions: [.ts, .tsx], definition: TypeScript 源码，包括 React 工程。}
    - {id: javascript, label: JavaScript/JSX, extensions: [.js, .jsx], definition: JavaScript 源码。}
    - {id: shell, label: Shell, extensions: [.sh], definition: Shell 脚本；CLI 是组件能力而非文件格式。}
    - {id: python, label: Python, extensions: [.py], definition: Python 源码。}
    - {id: svg, label: SVG, extensions: [.svg], definition: 矢量图形。}
    - {id: binary-project, label: 原生工程文件, extensions: [], definition: 具体工具工程，如 Blender、PPTX、DOCX；记录文件路径与必要软件条件。}
    - {id: media, label: 媒体文件, extensions: [], definition: 图片、视频、音频等；标明实际 MIME，预览媒体不自动成为内容格式。}
  conventions:
    - {id: skill-md, label: SKILL.md, definition: Agent Skill 入口约定；也可能用于封装模板。}
    - {id: agents-md, label: AGENTS.md, definition: Agent 工作导引文件约定；私有上下文不在公共目录中。}
    - {id: design-md, label: DESIGN.md, definition: Agent 可读设计规范约定，不包含所有名为 design.md 的工程设计文档。}
    - {id: tokens, label: Design Tokens, definition: 命名设计值及语义映射；不是主类或运行工具。}
    - {id: plugin-manifest, label: 插件清单, definition: 上游插件身份、组件和声明的清单；不强制所有上游采用同一格式。}
    - {id: mcp, label: MCP, definition: 工具连接协议；MCP 配置通常为 JSON，服务器实现格式另记。}
  plugin_component_types:
    - {id: skill, label: Skill, definition: 插件内任务方法与辅助资源。}
    - {id: mcp-server, label: MCP Server, definition: 插件提供或连接的具体 MCP 服务；作为运行依赖的服务不重复列为组件。}
    - {id: cli, label: CLI, definition: 插件提供的命令行入口。}
    - {id: template, label: 设计模板, definition: 插件内可复用产物结构。}
    - {id: design-system, label: 设计系统, definition: 插件内设计规范和 tokens/CSS。}
    - {id: prompt, label: 提示词, definition: 插件内图片、视频或原则文本，记录具体 subtype。}
    - {id: host-module, label: 宿主模块, definition: 宿主提供的模块引用；不表示插件可独立携带或运行该模块。}
    - {id: hook, label: Hook, definition: 插件声明的生命周期脚本或回调。}
