- id: dist.remotion-skills-cli
  name: Remotion Agent Skills install channels
  url: https://www.remotion.dev/docs/ai/skills
  roles: [distribution-channel]
  access: public
  tracking: {scope: 'Official Remotion Agent Skills install options: npx skills add remotion-dev/skills and bun create video; CLI adds/removes/updates skills via npx remotion skills add/update.', exclude: [],
    baseline: official documentation pages read 2026-10-07, cadence: manual, method: 'Check official install documentation and commands for changes, then verify they still point to the pinned content repository;
      update only install metadata and never infer permissions or content version from the CLI.', promotion: Treat as distribution/install instructions only; never use as content provenance or skill license
      evidence., last_checked: '2026-10-07', limitations: ['npx skills is a distribution CLI, not the source repository/content.', Official skill repository full HEAD SHA was not retrieved this check.]}
