:root {
  color-scheme: light dark;
  --paper: #faf9f6;
  --ink: #242620;
  --sheet: #fff;
  --accent: #365a43;
  --on-accent: #fff;
  --soft: #efeee9;
  --quiet: #5e625a;
  --line: #d7d8cf;
  --error: #a5362f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #181a18;
    --ink: #efeee7;
    --sheet: #20241f;
    --accent: #aecab1;
    --on-accent: #122018;
    --soft: #2d322b;
    --quiet: #b3bab0;
    --line: #434a40;
    --error: #ffa99f;
  }
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: system-ui, sans-serif;
}
button {
  cursor: pointer;
}
button:disabled, [data-disabled] {
  cursor: default;
  opacity: 0.5;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.learning-button, .learning-select {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.55rem 0.9rem;
  border-radius: 0.75rem;
  font-weight: 500;
  line-height: 1.3;
}
.learning-button {
  background: var(--accent);
  color: var(--on-accent);
}
.learning-button[data-variant="outline"], .learning-select {
  background: var(--sheet);
  color: var(--ink);
  border: 1px solid var(--line);
}
.learning-button[data-variant="ghost"] {
  color: var(--ink);
  background: transparent;
}
.learning-button svg, .learning-option svg {
  width: 1rem;
  height: 1rem;
  flex: none;
}
.learning-select {
  width: 100%;
  min-height: 2.75rem;
  justify-content: space-between;
  text-align: start;
}
.learning-menu {
  z-index: 10;
  padding: 0.25rem;
  overflow: auto;
  min-width: min(12rem, 90vw);
  max-width: calc(100vw - 1rem);
  max-height: min(60vh, var(--radix-select-content-available-height, 60vh));
  background: var(--sheet);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 1rem;
  box-shadow: 0 0.5rem 1.75rem #0002;
}
[data-radix-select-viewport] {
  width: var(--radix-select-trigger-width);
}
.learning-option {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-height: 2.5rem;
  border-radius: 0.55rem;
  padding: 0.45rem 0.7rem;
  cursor: pointer;
  outline: none;
}
.learning-option[data-highlighted] {
  background: var(--soft);
  color: var(--accent);
}
.learning-option [data-radix-select-item-indicator] {
  margin-inline-start: auto;
}
.learning-radio, .learning-checkbox {
  display: grid;
  place-content: center;
  border: 1px solid var(--line);
  background: var(--sheet);
  width: 1.05rem;
  height: 1.05rem;
  flex: none;
}
.learning-radio {
  border-radius: 50%;
}
.learning-checkbox {
  border-radius: 0.25rem;
}
.learning-radio[data-state="checked"], .learning-checkbox[data-state="checked"] {
  border-color: var(--accent);
  color: var(--accent);
}
.learning-radio-dot {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 50%;
  background: var(--accent);
}
.learning-field {
  width: 100%;
  background: var(--sheet);
  border: 1px solid var(--line);
  padding: 0.65rem 0.8rem;
}
