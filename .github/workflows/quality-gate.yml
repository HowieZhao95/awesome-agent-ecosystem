name: quality-gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Python catalog and source tests
        run: python -m unittest discover -s tests -v
      - name: Schema and discovery validation
        run: |
          python scripts/validate.py
          python scripts/validate-discovery.py
      - name: Generated contract consistency
        run: |
          npm run generate
          git diff --exit-code -- README.md site/data.js site/catalog.json src/generated
      - name: Public logic and shared UI tests
        run: |
          npm test
          npm run typecheck
      - name: Public package and standalone production build
        run: npm run build
      - name: External host consumes packaged exports
        run: npm run check:host
