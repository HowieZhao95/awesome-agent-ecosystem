name: weekly-sync

on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 09:00 (UTC+8)
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Test sync code
        run: python -m unittest discover -s tests -v

      - name: Validate configured catalog sources
        run: python scripts/validate.py

      - name: Snapshot locked upstream sources
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python scripts/auto-source-sync.py --output-dir docs/evidence/source-sync

      - name: Verify generated catalog remains unchanged
        run: |
          npm run generate
          git diff --exit-code -- README.md site/data.js site/catalog.json src/generated

      # Prefer secrets.GH_TOKEN (PAT / fine-grained, not GITHUB_TOKEN) so the PR author is a
      # real user and pull_request triggers quality-gate/validate. github.token fallback creates
      # github-actions[bot] PRs that skip same-repo workflows; see MAINTENANCE.md "Bot PR 与 quality-gate".
      - name: Open update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          branch: bot/weekly-sync
          delete-branch: true
          title: "data: weekly sync ${{ github.run_number }}"
          commit-message: "data: review configured source snapshots"
          add-paths: |
            docs/evidence/source-sync/*.json
            data/catalog-manifest.json
          body: |
            已登记来源的固定 commit、完整性和候选差异，详见来源报告及 Actions 日志。
            如已登记 P0 资产，catalog manifest 会随该资产的固定来源版本一起更新。
            本 PR 不更改历史发现队列，不自动晋级资源，也不触发产品安装或生产同步。

            人工确认无误且 **quality-gate / validate 绿勾** 后 merge 即可。
            若 Checks 无 validate（常见于默认 GITHUB_TOKEN 开的 bot PR）：Close → Reopen 后重跑，见 MAINTENANCE.md。
          labels: data-sync
