name: weekly-sync

on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 09:00 (UTC+8)
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci

      - name: Test sync code
        run: python -m unittest discover -s tests -v

      - name: Import from marketplaces & registries
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          python scripts/import-marketplace.py
          python scripts/import-skills-mcp.py

      - name: Refresh stars
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python scripts/update-stars.py

      - name: Validate discovery queue
        run: python scripts/validate-discovery.py

      - name: Snapshot locked upstream sources
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python scripts/auto-source-sync.py --output-dir docs/evidence/source-sync

      - name: Sample link check (50 URLs)
        run: python scripts/link-check.py --sample 50

      - name: Generate catalog projections for the reviewed data
        run: npm run generate

      - name: Open update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          branch: bot/weekly-sync
          delete-branch: true
          title: "data: weekly sync ${{ github.run_number }}"
          commit-message: "data: weekly sync (discovery imports + metadata scan)"
          body: |
            自动数据同步：
            - import-marketplace / import-skills-mcp 增量
            - stars 刷新
            - locked upstream source snapshots (review-only)
            - regenerated catalog projections for the discovery changes
            - 链接抽样检查（见 workflow 日志）

            人工确认无误后 merge 即可。
          labels: data-sync
